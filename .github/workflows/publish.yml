name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag（latest / next 等）'
        required: false
        default: 'latest'
        type: string
      dry_run:
        description: '仅构建不发布（dry run）'
        required: false
        default: false
        type: boolean

# 同一时间只允许一个发布任务运行
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest

    permissions:
      contents: read     # 需要读取仓库代码
      id-token: write    # 生成 npm provenance 证明所需

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/cjs/index.js
          test -f dist/esm/index.js
          test -f dist/types/index.d.ts

      - name: Publish to npm
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: npm publish --tag "${{ github.event.inputs.tag }}" --access public

